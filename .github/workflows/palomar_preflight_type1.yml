name: Palomar preflight (Type 1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: origamitype1
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"palomar/OrigamiTorus/EightVertex/Type1/comparator.json",
         "formalization_metadata_path":"palomar/OrigamiTorus/EightVertex/Type1/formalization.yaml",
         "authorization_relationship":"I am a responsible author or maintainer"}
