version: v0.4
project:
  name: Universality of the Type 3 origami torus triangulation
  description: >-
    Every rank-two plane lattice torus has a piecewise-isometric embedding in ℝ³ with the
    labeled Type 3 triangulation. The proof checks the published planar families and height
    vectors, solves the fixed-period edge-length equations, and verifies that the lifted faces
    triangulate the lattice quotient.
  authors:
  - The-Anh Vu-Le
  responsible_maintainers:
  - The-Anh Vu-Le
  license: NOASSERTION
classification:
  arxiv:
  - math.MG
  - math.CO
  msc2020:
  - 52C25
  - 57Q05
sources:
- title: A Universal 8-Vertex Origami Torus Triangulation
  authors:
  - Peter Doyle
  - Fabian Lander
  - Richard Evan Schwartz
  - Steve Trettel
  id: arXiv:2611.21909v1
  location: https://arxiv.org/abs/2611.21909v1
  relationship: formalizes
  note: Theorem 1.1 is the Type 3 universality theorem. The entry uses its planar families
    and height data.
status:
  scope: >-
    The proof uses fixed-period length matching for inflation and a multiplicity-one area
    argument for the quotient.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
