version: v0.4
project:
  name: Universality and regularity of the Type 6 origami torus triangulation
  description: >-
    Every rank-two plane lattice torus has a piecewise-isometric embedding on the labeled
    Lutz Type 6 complex. The same spatial vertices give rank nine for the joint angle and
    marked-modulus map. The construction flips the Type 3 diagonal and matches 24 edge lengths
    while keeping both periods fixed.
  authors:
  - The-Anh Vu-Le
  responsible_maintainers:
  - The-Anh Vu-Le
  license: Apache-2.0
classification:
  arxiv:
  - math.MG
  - math.CO
  msc2020:
  - 52C25
  - 57Q05
sources:
- title: A Universal 8-Vertex Origami Torus Triangulation
  authors:
  - Peter Doyle
  - Fabian Lander
  - Richard Evan Schwartz
  - Steve Trettel
  id: arXiv:2611.21909v1
  location: https://arxiv.org/abs/2611.21909v1
  relationship: adapts
  note: The entry flips the planar families of the Type 3 proof. Section 6 does not identify
    the second candidate by a face list.
- title: Discrete conformal maps and ideal hyperbolic polyhedra
  authors:
  - Alexander I. Bobenko
  - Ulrich Pinkall
  - Boris A. Springborn
  id: arXiv:1005.2698
  location: https://arxiv.org/abs/1005.2698
  relationship: background
  note: Proposition 4.1.6 gives the cotangent Hessian used in the cone-angle rank argument.
status:
  scope: >-
    The face list is the Type 6 complex in the flipped Type 3 labeling. The lattice basis
    used for the regularity map may be obtained by reduction.
