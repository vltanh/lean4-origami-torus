  - source: docs/EightVertex/Type5.md, The near-square box
    lean: OrigamiTorusType5Challenge.type5_nonrectangular_box
    module: OrigamiTorus.EightVertex.Type5.Challenge
    status: proved
  - source: docs/EightVertex/Type5HandProof.md, A flat torus in the off-ray family
    lean: OrigamiTorusType5Challenge.type5_oblique_box
    module: OrigamiTorus.EightVertex.Type5.Challenge
    status: proved
  - source: docs/EightVertex/Type5HandProof.md, Seven planes suffice
    lean: OrigamiTorusType5Challenge.type5_off_ray_separation
    module: OrigamiTorus.EightVertex.Type5.Challenge
    status: proved
  - source: docs/EightVertex/Type5HandProof.md, The sharp-ray determinant criterion
    lean: OrigamiTorusType5Challenge.type5_sharp_ray_separation
