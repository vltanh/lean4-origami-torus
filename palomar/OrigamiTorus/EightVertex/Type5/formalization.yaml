version: v0.4
project:
  name: Exact square and nonrectangular Type 5 origami tori
  description: >-
    The Lutz Type 5 triangulation realizes the unit square torus and every lattice torus in
    a closed nonrectangular modulus box of radius 10⁻¹¹ in each coordinate, centered at (0.174241221618834,
    1.084897889755590). The proofs use exact radicals and verify face lengths, embeddedness,
    and one-sheeted development to the specified lattice quotient.
  authors:
  - The-Anh Vu-Le
  responsible_maintainers:
  - The-Anh Vu-Le
  license: NOASSERTION
classification:
  arxiv:
  - math.MG
  - math.CO
  msc2020:
  - 52C25
  - 57Q05
sources:
- title: Type 5 square and nonrectangular radical constructions
  type: original-proof
  relationship: other
  note: The coordinates, quadratic choices, and modulus box are given in docs/EightVertex/Type5.md.
- title: The two most symmetric flat tori as eight-vertex paper tori
  authors:
  - Fabian Lander
  id: arXiv:2609.10703v1
  location: https://arxiv.org/abs/2609.10703v1
  relationship: background
  note: Section 6 and Appendix B discuss numerical square examples and ask for exact eight-vertex
    coordinates.
- title: An explicit PL-embedding of the square flat torus into E³
  authors:
  - Tanessi Quintanar
  location: https://jocg.org/index.php/jocg/article/view/3114
  relationship: background
  note: The earlier exact square construction uses 40 vertices. The entry fixes the eight-vertex
    Type 5 triangulation.
status:
  scope: >-
    The comparison covers the square metric and the stated box. The explicit radical vertex
    choices are constructed and checked in the library.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
