version: v0.4
project:
  name: Type 5 origami tori, leaf completions and spatial separation
  description: >-
    The Lutz Type 5 triangulation embeds the square and every torus in two explicit modulus
    boxes, one near the square and one about (1+i√31)/4. Two sets of seventeen oriented
    tetrahedron signs each suffice for a closed spatial embedding. A positive five-cycle of
    squared-distance deficits gives exactly two simultaneous spatial and intrinsic leaf positions.
  authors:
  - The-Anh Vu-Le
  responsible_maintainers:
  - The-Anh Vu-Le
  license: Apache-2.0
classification:
  arxiv:
  - math.MG
  - math.CO
  msc2020:
  - 52C25
  - 57Q05
sources:
- title: Type 5 dyadic-grid radical constructions
  type: original-proof
  relationship: other
  note: The coordinates, quadratic choices, and modulus box are given in docs/EightVertex/Type5.md.
- title: Spatial separation and the oblique Type 5 modulus box
  type: original-proof
  relationship: other
  note: docs/EightVertex/Type5HandProof.md gives the determinant identities, incidence tables, and oblique core.
- title: Completing a Type 5 leaf
  type: original-proof
  relationship: other
  note: docs/EightVertex/Type5PositiveCycle.md gives the mixed Gram construction and its two real solutions.
- title: The two most symmetric flat tori as eight-vertex paper tori
  authors:
  - Fabian Lander
  id: arXiv:2609.10703v1
  location: https://arxiv.org/abs/2609.10703v1
  relationship: background
  note: Section 6 and Appendix B discuss numerical square examples and ask for exact eight-vertex
    coordinates.
- title: An explicit PL-embedding of the square flat torus into E³
  authors:
  - Tanessi Quintanar
  location: https://jocg.org/index.php/jocg/article/view/3114
  relationship: background
  note: The earlier exact square construction uses 40 vertices. The entry fixes the eight-vertex
    Type 5 triangulation.
status:
  scope: >-
    The comparison covers three unconditional metric-existence statements, two spatial
    separation implications, and a five-point completion theorem. The full nonhexagonal
    existence theorem still has parameter-dependent steps outside Lean. Existence at the
    hexagonal modulus is open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: agent
    models:
    - GPT-6
    framework: OpenAI Codex
    tool_setup: GPT-6 contributed to mathematical proof development, Lean implementation,
      and separate review runs. See docs/CREDITS.md.
    cost:
      wall_time: not tracked
      spend_usd: not tracked
      hardware: local workstation
  notes: The-Anh Vu-Le directed and maintains the project. See docs/CREDITS.md for the human
    and AI contribution record.
review:
  status: agent-reviewed
  notes: The review and AI contribution record is in docs/CREDITS.md. Independent human review
    is pending.
