version: v0.4
project:
  name: Type 7 origami tori on the reduced strip and rectangular ray
  description: >-
    The Lutz Type 7 triangulation realizes every reduced modulus x+iy with 0 ≤ x < 1/2, y
    > 0, and x²+y² ≥ 1. It also realizes every rectangular lattice torus at its given scale.
    The construction uses trapezoidal planar bases, exact height separation, and inflation
    at a fixed marked modulus. The seven cone angles and complex marked modulus have a
    surjective differential at the same eight spatial vertices as the strip embedding.
  authors:
  - The-Anh Vu-Le
  responsible_maintainers:
  - The-Anh Vu-Le
  license: Apache-2.0
classification:
  arxiv:
  - math.MG
  - math.CO
  msc2020:
  - 52C25
  - 57Q05
sources:
- title: Collapsibility and Near Universality for Vertex Minimal Paper Tori
  authors:
  - Peter Doyle
  - Richard Evan Schwartz
  id: arXiv:2510.12623v4
  location: https://arxiv.org/abs/2510.12623v4
  relationship: adapts
  note: Theorem 1.1 covers Type 7 away from the rectangular and sharp-rhombic rays.
- title: The two most symmetric flat tori as eight-vertex paper tori
  authors:
  - Fabian Lander
  id: arXiv:2609.10703v1
  location: https://arxiv.org/abs/2609.10703v1
  relationship: adapts
  note: The square construction and its small rectangular continuation are the starting point
    for the full rectangular extension.
status:
  scope: >-
    The Challenge compares the original open-strip embedding theorem, its rank-nine
    refinement, and the embedding theorem for arbitrary-scale rectangular lattices.
    The sharp-rhombic ray remains open.
