version: v0.4
project:
  name: Nonexistence of a Type 1 origami torus
  description: >-
    No embedded realization of the Lutz Type 1 face complex has all cone angles equal to 2π.
    A flat degree-three star collapses to a single triangle. A finite determinant-sign refutation
    rules out the resulting seven-vertex flat embedding.
  authors:
  - The-Anh Vu-Le
  responsible_maintainers:
  - The-Anh Vu-Le
  license: NOASSERTION
classification:
  arxiv:
  - math.MG
  - math.CO
  msc2020:
  - 52C25
  - 57Q05
sources:
- title: The two most symmetric flat tori as eight-vertex paper tori
  authors:
  - Fabian Lander
  id: arXiv:2609.10703v1
  location: https://arxiv.org/abs/2609.10703v1
  relationship: independently-proves
  note: Section 6 deduces Type 1 nonexistence by collapsing the degree-three star.
- title: Vertex-Minimal Paper Tori
  authors:
  - Richard Evan Schwartz
  id: arXiv:2507.14998v9
  location: https://arxiv.org/abs/2507.14998v9
  relationship: background
  note: Schwartz proves nonexistence for seven vertices. This entry checks a separate sign
    refutation on the collapsed face complex.
status:
