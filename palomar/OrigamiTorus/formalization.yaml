version: "v0.4"

project:
  name: "Eight-vertex origami tori of Lutz Types 1–7"
  description: >-
    No embedded Lutz Type 1 or Type 2 realization has angle sum 2π at every
    vertex. Both proofs use kernel-checked determinant-sign refutations.
    Every rank-two plane lattice torus has piecewise-isometric embeddings of
    Types 3 and 6. The construction
    inflates exact planar families at fixed periods and proves that the
    intrinsic triangles cover the quotient once. The reduced open strip has
    Type 4 embeddings, and exact radicals give a Type 5 square embedding.
    At the same fitted Type 6 vertices
    the spatial angle and marked-period map has rank nine. Every rectangular lattice
    torus has a piecewise-isometric Type 7 embedding. Its proof preserves
    the marked modulus during inflation and identifies the intrinsic quotient
    by developing the faces and checking their translational gluing.
  authors:
    - "The-Anh Vu-Le"
  responsible_maintainers:
    - "The-Anh Vu-Le"
  license: "NOASSERTION"

classification:
  arxiv: ["math.MG", "math.CO"]
  msc2020: ["52C25", "57Q05"]

sources:
  - title: "Type 2 flatness obstruction and explicit Type 6 construction"
    type: other
    relationship: other
    note: "This project proves Lander's Type 2 conjecture and verifies a face-identified Type 6 construction. The identification of the second candidate in the Type 3 preprint is unresolved. See docs/RELATED_WORK.md."
  - title: "Type 4 open-strip theorem and exact Type 5 coordinates"
    type: other
    relationship: other
    note: "The two constructions are documented in docs/Type4.md and docs/Type5.md."
  - title: "Collapsibility and Near Universality for Vertex Minimal Paper Tori"
    authors: ["Peter Doyle", "Richard Evan Schwartz"]
    id: "arXiv:2510.12623v4"
    location: "https://arxiv.org/abs/2510.12623v4"
    relationship: adapts
    note: "Theorem 1.1 supplies Type 7 near universality. This project verifies the full rectangular ray and the reduced strip."
  - title: "The two most symmetric flat tori as eight-vertex paper tori"
    authors: ["Fabian Lander"]
    id: "arXiv:2609.10703v1"
    location: "https://arxiv.org/abs/2609.10703v1"
    relationship: adapts
    note: "The square-torus construction underlies the Type 7 rectangular extension. Section 6 gives the Type 1 star collapse and conjectures Type 2 nonexistence."
  - title: "Vertex-Minimal Paper Tori"
    authors: ["Richard Evan Schwartz"]
    id: "arXiv:2507.14998v9"
    location: "https://arxiv.org/abs/2507.14998v9"
    relationship: background
    note: "Section 2 proves the seven-vertex obstruction. The Type 1 proof verifies the obstruction on the collapsed face list by strict support and determinant signs."
  - title: "A Universal 8-Vertex Origami Torus Triangulation"
    authors: ["Peter Doyle", "Fabian Lander", "Richard Evan Schwartz", "Steve Trettel"]
    id: "arXiv:2611.21909v1"
    location: "https://arxiv.org/abs/2611.21909v1"
    relationship: formalizes
    note: "The Challenge includes Theorem 1.1 for the Type 3 face list. The Type 6 construction also uses the planar families after a diagonal exchange."

status:
  scope: >-
    The Challenge states Type 1 and Type 2 nonexistence, Type 3 universality,
    the unsatisfiability of the Type 2 determinant-sign conditions, the
    planar Type 6 flip signs and the existence of a generic
    lift with strict separating minors and twenty-four matched edge lengths.
    It also states generic perturbation of an embedded face list, the Type 6
    spatial embedding with matched lengths, and the piecewise-isometric
    Type 6 embedding for every lattice torus, with its rank-nine regularity.
    It includes the Type 4 open-strip embedding, the exact Type 5 square
    construction, and the piecewise-isometric
    Type 7 embedding for every rectangular lattice torus. The release license
    remains to be selected.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["GPT-6"]
      framework: "OpenAI Codex"
      tool_setup: >-
        GPT-6 contributed mathematical proof development, Lean implementation,
        certificate integration, separate review runs, and manuscript drafting.
        The development uses Lean 4, Mathlib, CaDiCaL, and SymPy.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation"
  spend_usd: "not tracked"
  notes: "The-Anh Vu-Le directed and maintains the project. See docs/CREDITS.md for the human and AI contribution record."

fidelity:
  divergences: >-
    The lattice existence statements allow changes of ordered generators that
    preserve the lattice. The Type 1 proof verifies the seven-vertex hull
    obstruction on the collapsed face list using strict support and a
    determinant-sign refutation. The Type 3 proof uses the fixed-period
    length system for the geometric inflation of Remark 5.4 and identifies
    the quotient by face orientation and total area.

review:
  status: "agent-reviewed"
  reviewers:
    - "Independent Codex GPT-6 agents reviewed Type 2 geometry and the signed clause reduction."
    - "Independent Codex GPT-6 agents reviewed Type 6 period geometry, the universal embedding, and spatial rank."
    - "Independent Codex GPT-6 agents reviewed Type 7 horizontal rank, marked displacements, and quotient geometry."
    - "An independent Codex GPT-6 agent reviewed the Type 4 and Type 7 finite reconstruction, the exact spatial intersection test, and the Type 4 and Type 5 Challenge statements."
  notes: "The technical reviews are recorded in docs/CREDITS.md. Independent human review is pending."

