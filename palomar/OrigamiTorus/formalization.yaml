version: "v0.4"

project:
  name: "Eight-vertex origami tori of Lutz Types 2, 4, 5, 6, and 7"
  description: >-
    No embedded Lutz Type 2 realization has angle sum 2π at every vertex.
    The proof reduces flatness to a finite determinant-sign obstruction
    and verifies an explicit resolution refutation. Every rank-two plane
    lattice torus has a piecewise-isometric Type 6 embedding. The construction
    inflates exact planar families at fixed periods and proves that the
    intrinsic triangles cover the quotient once. The reduced open strip has
    Type 4 embeddings, and exact radicals give a Type 5 square embedding.
    At the same fitted Type 6 vertices
    the spatial angle and marked-period map has rank nine. Every rectangular lattice
    torus has a piecewise-isometric Type 7 embedding. Its proof preserves
    the marked modulus during inflation and identifies the intrinsic quotient
    by developing the faces and checking their translational gluing.
  authors:
    - "The-Anh Vu-Le"
  responsible_maintainers:
    - "The-Anh Vu-Le"
  license: "NOASSERTION"

classification:
  arxiv: ["math.MG", "math.CO"]
  msc2020: ["52C25", "57Q05"]

sources:
  - title: "Type 2 obstruction and Type 6 flip certificates"
    type: original-proof
    relationship: other
    note: "The two arguments and their provenance are documented in docs/Type2.md and docs/Type6.md."
  - title: "Type 4 open-strip realization and Type 5 exact square construction"
    type: original-proof
    relationship: other
    note: "The two constructions are documented in docs/Type4.md and docs/Type5.md."
  - title: "Type 7 rectangular construction and translational gluing"
    type: original-proof
    relationship: other
    note: "The horizontal rank, marked inflation, and lattice quotient argument are documented in docs/Type7.md."
  - title: "The two most symmetric flat tori as eight-vertex paper tori"
    authors: ["Fabian Lander"]
    id: "arXiv:2609.10703v1"
    location: "https://arxiv.org/abs/2609.10703v1"
    relationship: background
    note: "Section 6 asks whether Lutz Type 2 admits a paper torus."
  - title: "A Universal 8-Vertex Origami Torus Triangulation"
    authors: ["Peter Doyle", "Fabian Lander", "Richard Evan Schwartz", "Steve Trettel"]
    id: "arXiv:2611.21909v1"
    location: "https://arxiv.org/abs/2611.21909v1"
    relationship: background
    note: "Section 3 gives the Type 3 planar families. Sections 4 and 5 give the lift and inflation framework."

status:
  scope: >-
    The Challenge states Type 2 nonexistence, the unsatisfiability of the
    Type 2 determinant-sign conditions, the planar Type 6 flip signs and the existence of a generic
    lift with strict separating minors and twenty-four matched edge lengths.
    It also states generic perturbation of an embedded face list, the Type 6
    spatial embedding with matched lengths, and the piecewise-isometric
    Type 6 embedding for every lattice torus, with its rank-nine regularity.
    It includes the Type 4 open-strip embedding, the exact Type 5 square
    construction, and the piecewise-isometric
    Type 7 embedding for every rectangular lattice torus. The checkpoint is private and
    the release license remains to be selected.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["GPT-6"]
      framework: "OpenAI Codex"
      tool_setup: >-
        Lean 4, Mathlib, human mathematical writeups, fraction arithmetic,
        CaDiCaL proof search, and Lean kernel replay of reverse unit propagation.
        The workflow follows formalize-math-paper 4.8.1.
      cost:
        wall_time: "See docs/CREDITS.md"
        spend_usd: "not tracked"
        hardware: "local workstation"
  spend_usd: "not tracked"
  notes: "See docs/CREDITS.md."

fidelity:
  divergences: >-
    The Type 6 and Type 7 existence statements allow changes of ordered lattice
    generators that preserve the lattice.

review:
  status: "agent-reviewed"
  reviewers:
    - "Independent Codex GPT-6 agents reviewed Type 2 geometry and the signed clause reduction."
    - "Independent Codex GPT-6 agents reviewed Type 6 period geometry, the universal embedding, and spatial rank."
    - "Independent Codex GPT-6 agents reviewed Type 7 horizontal rank, marked displacements, and quotient geometry."
    - "An independent Codex GPT-6 agent reviewed the Type 4 and Type 7 finite reconstruction, the exact spatial intersection test, and the Type 4 and Type 5 Challenge statements."
  notes: "The technical reviews are recorded in docs/CREDITS.md. Independent human review is pending."

